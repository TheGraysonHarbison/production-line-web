name: Release

# On a version tag: build and push the multi-arch image to GHCR, smoke-test the pushed image,
# run the upgrade test from the previously published :latest, and attach the standalone tarball
# to a GitHub release (a pre-release when the tag has a suffix such as -rc.1). Roadmap Phase 11.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/goblinfoddergames/production-line-web

jobs:
  release:
    name: Build, publish image, publish tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Derive version from the tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          npm pkg set version="$VERSION"
          npm pkg set version="$VERSION" --workspaces

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Release tarball
        run: npm run release -- --no-build --version "${{ steps.ver.outputs.version }}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN can only publish under the repository owner's namespace. If the image
          # lives under a different organisation, add a GHCR_TOKEN secret (write:packages).
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        run: |
          TAGS="${IMAGE}:${{ steps.ver.outputs.version }}"
          if [ "${{ steps.ver.outputs.prerelease }}" = "false" ]; then TAGS="$TAGS,${IMAGE}:latest"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          docker pull "${IMAGE}:${{ steps.ver.outputs.version }}"
          docker run -d --name plw -p 8080:8080 "${IMAGE}:${{ steps.ver.outputs.version }}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/meta; then echo; docker rm -f plw; exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"; docker logs plw; exit 1
      - name: Upgrade test from the previous release
        run: scripts/upgrade-test.sh "${IMAGE}:latest" "${IMAGE}:${{ steps.ver.outputs.version }}"

      - name: GitHub release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(--title "${GITHUB_REF_NAME}" --generate-notes)
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" "${ARGS[@]}" \
            release/production-line-web-${{ steps.ver.outputs.version }}.tar.gz \
            release/production-line-web-${{ steps.ver.outputs.version }}.tar.gz.sha256
