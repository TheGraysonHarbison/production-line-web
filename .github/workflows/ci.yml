name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  image:
    name: Container image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: production-line-web:ci
          cache-from: type=gha
      - name: Smoke test /api/meta
        run: |
          docker run -d --name plw -p 8080:8080 production-line-web:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/meta; then echo; docker rm -f plw; exit 0; fi
            sleep 1
          done
          echo "server did not become healthy"; docker logs plw; exit 1
      - name: Upgrade test from the last published image (skipped until one exists)
        run: scripts/upgrade-test.sh ghcr.io/thegraysonharbison/production-line-web:latest production-line-web:ci
      - name: Release tarball builds
        run: npm run release -- --no-build
